# Lumos lamp controller: 38-pin ESP32 (ESP32-D0WD-V3, 4 MB, CP2102) + AOICRIE
# CC1101 at 433.92 MHz. GPIO numbers match the perfboard in CC1101-ESP32-wiring.md.
# The previous ESP32-S3 build is in git history and CC1101-ESP32-S3-wiring.md.
#
# Safety rules (see .github/copilot-instructions.md):
# - The radio transmits only when a Home Assistant button is pressed.
#   Nothing transmits at boot, on Wi-Fi or API (re)connect, on OTA, or on a
#   timer: there are no boot, connect, or interval automations here.
# - No entity claims to know the lamp's state: buttons only, so there are
#   no switch, light, or number entities and nothing to restore at boot.
# - Commands come only from lamp-commands.generated.yaml, which is generated
#   from captures/commands.json. Never edit that file by hand.

substitutions:
  tx_repeat: "8"

esphome:
  name: lumos-lamp
  friendly_name: Lumos Lamp
  min_version: 2026.10.2

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 4MB             # esptool flash-id: 4MB, no PSRAM
  framework:
    type: esp-idf

logger:
  # Logs go to UART0, which the CP2102 exposes as /dev/cu.usbserial-*.
  # Host-side setting for `esphome logs`: leave DTR/RTS released so opening the
  # port cannot pulse the CP2102 auto-reset into download mode (the S3 did
  # exactly that in H3).
  deassert_rts_dtr: true

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}          # OTA reuses the API encryption key; no separate password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:                        # the ESP32's standard VSPI pins
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

cc1101:
  id: radio
  # Matches the soldered perfboard: radio CSN is wired to GPIO4.
  cs_pin: GPIO4
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  # The component enters RX at boot; it never transmits on its own.

remote_transmitter:
  id: tx
  # GPIO5 -> CC1101 GDO0. In RX the CC1101 drives GDO0 as a serial data
  # output, so a push-pull GPIO5 held low would fight it. Open-drain with the
  # internal pull-up releases the line except while transmitting. This is the
  # pin handling ESPHome documents for ESP32 + CC1101 on a shared GDO0.
  pin:
    # GPIO5 is a strapping pin (ESPHome warns); it only sets SDIO slave
    # timing at reset, which this board never uses.
    number: GPIO5
    mode:
      output: true
      open_drain: true
      pullup: true
  # Hold the line low (carrier off) when a transmission ends, until the radio
  # has left TX; on_complete then releases it.
  eot_level: false
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      # Drive the data line low before entering TX so no carrier is keyed
      # between begin_tx and the first pulse.
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: tx
          value: false
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: tx
          value: true
      - cc1101.begin_rx: radio

remote_receiver:
  id: rx
  pin: GPIO22                # CC1101 GDO2
  dump: [raw, rc_switch]
  tolerance: 25%
  filter: 100us
  idle: 5ms

packages:
  commands: !include lamp-commands.generated.yaml


# Bluetooth proxy for the Govee BLE lamps. Uses the ESP32's own 2.4 GHz radio;
# the CC1101 (433 MHz) is untouched. Default scan parameters on purpose.
esp32_ble_tracker:

bluetooth_proxy:
  active: true
