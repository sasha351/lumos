# Lumos lamp controller: DORHEA ESP32-S3 N16R8 + AOICRIE CC1101 at 433.92 MHz.
# GPIO numbers match the soldered wiring in CC1101-ESP32-S3-wiring.md.
#
# Safety rules (see .github/copilot-instructions.md):
# - The radio transmits only when a Home Assistant button is pressed.
#   Nothing transmits at boot, on Wi-Fi or API (re)connect, on OTA, or on a
#   timer: there are no boot, connect, or interval automations here.
# - No entity claims to know the lamp's state: buttons only, so there are
#   no switch, light, or number entities and nothing to restore at boot.
# - Commands come only from lamp-commands.generated.yaml, which is generated
#   from captures/commands.json. Never edit that file by hand.

substitutions:
  tx_repeat: "8"

esphome:
  name: lumos-lamp
  friendly_name: Lumos Lamp
  min_version: 2026.10.2

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
# PSRAM is deliberately not configured. The firmware does not need it, and a
# wrong PSRAM mode can stop the board from booting. H1 found 8 MB of embedded
# octal PSRAM (ESP32-S3R8), so if it is ever enabled use `psram: mode: octal`.

logger:
  # H1 found native USB-Serial/JTAG on /dev/cu.usbmodem*. This is the ESP32-S3
  # default; it is set explicitly so boot logs are guaranteed on that port.
  hardware_uart: USB_SERIAL_JTAG
  # Host-side setting for `esphome logs` over USB. Without it the CLI opens the
  # port with DTR/RTS asserted, which the S3's USB-Serial/JTAG treats as a
  # reset into download mode (observed in H3: rst:0x15, boot:0x3, "waiting for
  # download"), so the firmware never runs while logs are open.
  deassert_rts_dtr: true

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}          # OTA reuses the API encryption key; no separate password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

cc1101:
  id: radio
  cs_pin: GPIO10
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  # The component enters RX at boot; it never transmits on its own.

remote_transmitter:
  id: tx
  # GPIO4 -> CC1101 GDO0. In RX the CC1101 drives GDO0 as a serial data
  # output, so a push-pull GPIO4 held low would fight it. Open-drain with the
  # internal pull-up releases the line except while transmitting. This is the
  # pin handling ESPHome documents for ESP32 + CC1101 on a shared GDO0.
  pin:
    number: GPIO4
    mode:
      output: true
      open_drain: true
      pullup: true
  # Hold the line low (carrier off) when a transmission ends, until the radio
  # has left TX; on_complete then releases it.
  eot_level: false
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      # Drive the data line low before entering TX so no carrier is keyed
      # between begin_tx and the first pulse.
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: tx
          value: false
      - cc1101.begin_tx: radio
  on_complete:
    then:
      - cc1101.set_idle: radio
      - remote_transmitter.digital_write:
          transmitter_id: tx
          value: true
      - cc1101.begin_rx: radio

remote_receiver:
  id: rx
  pin: GPIO5                 # CC1101 GDO2
  dump: [raw, rc_switch]
  tolerance: 25%
  filter: 100us
  idle: 5ms

packages:
  commands: !include lamp-commands.generated.yaml
